name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Test (SQLite, default suite)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: pytest -v

  backend-postgres:
    name: Backend (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (Postgres-specific)
        env:
          DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
        run: |
          # Wait for postgres to be ready
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U pulse; then
              echo "Postgres ready"; break
            fi
            sleep 1
          done
          pytest tests/integration/test_postgres.py -v
      - name: Test (full suite, including routes + websocket, on Postgres)
        env:
          DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
        run: |
          pytest tests/ -v
          # Note: the full suite is run on SQLite in the previous job to
          # keep the test feedback loop fast; this job focuses on the
          # Postgres-specific behavior.

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
