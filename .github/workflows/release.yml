name: release

# CD workflow — triggered when a tag matching `v*.*.*` is pushed.
#
# What it does:
#   1. Builds two Docker images (backend + frontend) for linux/amd64 and
#      linux/arm64 using Docker Buildx + QEMU.
#   2. Pushes them to GitHub Container Registry (ghcr.io).
#   3. Derives multiple tags from the source tag via docker/metadata-action:
#        v1.2.3 -> :v1.2.3, :v1.2, :v1, :latest
#      so users can pin to major/minor/exact.
#   4. Generates SBOMs (provenance: true, sbom: true).
#   5. Optionally signs with cosign (keyless, OIDC) — see SIGN env var.
#
# To cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# To sign images, push a tag with a branch that has `sign=true` in the
# commit message trailer, OR run the workflow manually via workflow_dispatch
# (configured below).

on:
  push:
    tags:
      - "v*.*.*"   # matches v0.1.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign images with cosign (keyless, OIDC)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign OIDC (only used when signing)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the canonical image tag list from the source git tag.
      # For v1.2.3, this produces: v1.2.3, v1.2, v1, latest
      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pulse-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pulse-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Sign the most-specific tag (the one matching the git tag) so users
      # can verify it via `cosign verify`. Skipped by default to keep the
      # first release workflow simple; enable by manual dispatch with
      # sign=true.
      - name: Install cosign
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == true }}
        uses: sigstore/cosign-installer@v3

      - name: Sign images with cosign (keyless)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign == true }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          VERSION_TAG="${{ github.ref_name }}"
          for image in pulse-backend pulse-frontend; do
            full="ghcr.io/${{ github.repository_owner }}/${image}:${VERSION_TAG}"
            echo "→ Signing $full"
            cosign sign --yes "$full"
          done

      - name: Summary
        run: |
          echo "### 🐳 Release images published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${{ github.repository_owner }}/pulse-backend\` | \`${{ steps.meta-backend.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ghcr.io/${{ github.repository_owner }}/pulse-frontend\` | \`${{ steps.meta-frontend.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/pulse-backend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/pulse-frontend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
